<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>&#36138;&#21507;&#34503; Snake</title>
<style>
  :root {
    --bg: #0f1720;
    --panel: #16212c;
    --grid: #1c2a37;
    --snake: #4ade80;
    --snake-head: #22c55e;
    --food: #f87171;
    --text: #e2e8f0;
    --muted: #7f8fa6;
    --accent: #38bdf8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: radial-gradient(circle at 50% 0%, #1b2a3a 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    user-select: none;
    padding: 20px;
  }
  h1 {
    margin: 0;
    font-size: 22px;
    letter-spacing: 4px;
    font-weight: 600;
    color: var(--accent);
    text-shadow: 0 0 18px rgba(56, 189, 248, 0.35);
  }
  .hud {
    width: 100%;
    max-width: 480px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    color: var(--muted);
  }
  .hud .score { color: var(--text); font-weight: 600; }
  .hud .score span { color: var(--snake); font-size: 18px; }
  .hud .best { color: var(--muted); }
  .hud .best b { color: #fbbf24; }
  .stage {
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.06);
  }
  canvas { display: block; background: var(--panel); touch-action: none; }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    background: rgba(9, 14, 20, 0.78);
    backdrop-filter: blur(3px);
    padding: 20px;
    transition: opacity 0.18s ease;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay h2 { margin: 0; font-size: 26px; letter-spacing: 2px; }
  .overlay p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.7; }
  .overlay .big { color: var(--snake); font-size: 30px; font-weight: 700; }
  .overlay.over h2 { color: var(--food); }
  .btn {
    margin-top: 6px;
    padding: 10px 26px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(135deg, #38bdf8, #22c55e);
    color: #06202b;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 1px;
    box-shadow: 0 6px 18px rgba(34, 197, 94, 0.3);
    transition: transform 0.1s ease, filter 0.15s ease;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: scale(0.96); }
  kbd {
    display: inline-block;
    padding: 1px 7px;
    border-radius: 5px;
    background: #24323f;
    border-bottom: 2px solid #0b1118;
    color: var(--text);
    font-size: 12px;
    font-family: inherit;
  }
  .footer { color: #55657a; font-size: 12px; }
  .paused-tag {
    position: absolute;
    top: 12px;
    right: 12px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    background: rgba(251, 191, 36, 0.15);
    color: #fbbf24;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .paused-tag.show { opacity: 1; }
</style>
</head>
<body>
  <h1>&#36138; &#21507; &#34503;</h1>

  <div class="hud">
    <div class="score">&#24471;&#20998; <span id="score">0</span></div>
    <div class="best">&#26368;&#39640;&#20998; <b id="best">0</b></div>
    <div>&#36895;&#24230; <b id="speed" style="color:#38bdf8">1</b></div>
  </div>

  <div class="stage">
    <canvas id="game"></canvas>
    <div class="paused-tag" id="pausedTag">&#24050;&#26242;&#20572;</div>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">&#20934;&#22791;&#22909;&#20102;&#21527;&#65311;</h2>
      <p id="ovText">
        <kbd>&#8593;</kbd> <kbd>&#8595;</kbd> <kbd>&#8592;</kbd> <kbd>&#8594;</kbd> / <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> &#31227;&#21160;<br>
        <kbd>&#31354;&#26684;</kbd> &#26242;&#20572; / &#32487;&#32493; &nbsp;&#183;&nbsp; &#25163;&#26426;&#21487;&#28369;&#21160;&#23631;&#24149;
      </p>
      <button class="btn" id="startBtn">&#24320;&#22987;&#28216;&#25103;</button>
    </div>
  </div>

  <div class="footer">&#25353;&#26041;&#21521;&#38190;&#20986;&#21457; &#183; &#21507;&#21040;&#39135;&#29289;&#21464;&#38271;&#65292;&#25758;&#22681;&#25110;&#25758;&#21040;&#33258;&#24049;&#23601;&#32467;&#26463; &#183; &#31354;&#26684;&#26242;&#20572;</div>

<script>
(function () {
  "use strict";

  // ====== \u914d\u7f6e ======
  const COLS = 24;            // \u6a2a\u5411\u683c\u5b50\u6570
  const ROWS = 24;            // \u7eb5\u5411\u683c\u5b50\u6570
  const CELL = 20;            // \u6bcf\u683c\u50cf\u7d20
  const BASE_TICK = 400;      // \u521d\u59cb\u6bcf\u6b65\u6beb\u79d2\uff08\u8f83\u6162\uff0c\u9002\u5408\u6162\u901f\u64cd\u4f5c/\u8f85\u52a9\u5de5\u5177\uff09
  const MIN_TICK = 120;       // \u6700\u5feb\u6bcf\u6b65\u6beb\u79d2
  const SPEEDUP_EVERY = 20;   // \u6bcf\u5403\u51e0\u4e2a\u98df\u7269\u63d0\u901f
  const SPEEDUP_STEP = 20;    // \u6bcf\u6b21\u63d0\u901f\u51cf\u5c11\u7684\u6beb\u79d2

  const bestKey = "snake.bestScore";

  // ====== Canvas \u521d\u59cb\u5316\uff08\u9002\u914d\u9ad8\u5206\u5c4f\uff09======
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
  const W = COLS * CELL;
  const H = ROWS * CELL;

  function fitCanvas() {
    // \u5c0f\u5c4f\u5e55\u81ea\u9002\u5e94
    const maxW = Math.min(window.innerWidth - 40, 520);
    const scale = Math.min(1, maxW / W);
    canvas.style.width = Math.round(W * scale) + "px";
    canvas.style.height = Math.round(H * scale) + "px";
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  // ====== DOM ======
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const speedEl = document.getElementById("speed");
  const overlay = document.getElementById("overlay");
  const ovTitle = document.getElementById("ovTitle");
  const ovText = document.getElementById("ovText");
  const startBtn = document.getElementById("startBtn");
  const pausedTag = document.getElementById("pausedTag");

  // ====== \u6e38\u620f\u72b6\u6001 ======
  let snake, dir, nextDir, food, score, tick, alive, running, paused, accumulator, lastTime, foodPulse;

  let best = Number(localStorage.getItem(bestKey) || 0);
  bestEl.textContent = best;

  function reset() {
    const cx = Math.floor(COLS / 2);
    const cy = Math.floor(ROWS / 2);
    snake = [
      { x: cx, y: cy },
      { x: cx - 1, y: cy },
      { x: cx - 2, y: cy }
    ];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    tick = BASE_TICK;
    alive = true;
    running = false;
    paused = false;
    accumulator = 0;
    lastTime = 0;
    foodPulse = 0;
    speedEl.textContent = "1";
    scoreEl.textContent = "0";
    pausedTag.classList.remove("show");
    placeFood();
  }

  function placeFood() {
    const occupied = new Set(snake.map(s => s.x + "," + s.y));
    const empty = [];
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (!occupied.has(x + "," + y)) empty.push({ x, y });
      }
    }
    if (empty.length === 0) {
      // \u94fa\u6ee1\u68cb\u76d8\uff0c\u901a\u5173\uff01
      food = null;
      win();
      return;
    }
    food = empty[Math.floor(Math.random() * empty.length)];
  }

  // ====== \u7ed8\u5236 ======
  function drawGrid() {
    ctx.fillStyle = "#16212c";
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = "#1c2a37";
    ctx.lineWidth = 1;
    for (let x = 1; x < COLS; x++) {
      ctx.beginPath();
      ctx.moveTo(x * CELL + 0.5, 0);
      ctx.lineTo(x * CELL + 0.5, H);
      ctx.stroke();
    }
    for (let y = 1; y < ROWS; y++) {
      ctx.beginPath();
      ctx.moveTo(0, y * CELL + 0.5);
      ctx.lineTo(W, y * CELL + 0.5);
      ctx.stroke();
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    if (!snake) return;

    drawGrid();

    // \u98df\u7269
    if (food) {
      const px = food.x * CELL + CELL / 2;
      const py = food.y * CELL + CELL / 2;
      const r = CELL * 0.34 * (1 + 0.08 * Math.sin(foodPulse));
      const glow = ctx.createRadialGradient(px, py, 1, px, py, CELL * 0.9);
      glow.addColorStop(0, "rgba(248,113,113,0.45)");
      glow.addColorStop(1, "rgba(248,113,113,0)");
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(px, py, CELL * 0.9, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#f87171";
      ctx.beginPath();
      ctx.arc(px, py, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.75)";
      ctx.beginPath();
      ctx.arc(px - r * 0.3, py - r * 0.35, r * 0.28, 0, Math.PI * 2);
      ctx.fill();
    }

    // \u86c7\u8eab\uff08\u4ece\u5c3e\u5230\u5934\uff0c\u989c\u8272\u6e10\u53d8\uff09
    const n = snake.length;
    for (let i = n - 1; i >= 0; i--) {
      const s = snake[i];
      const t = n === 1 ? 0 : i / (n - 1);         // 0 = \u5934, 1 = \u5c3e
      const pad = 1.5 + t * 1.2;
      const x = s.x * CELL + pad;
      const y = s.y * CELL + pad;
      const size = CELL - pad * 2;

      if (i === 0) {
        ctx.fillStyle = "#22c55e";
        ctx.shadowColor = "rgba(34,197,94,0.8)";
        ctx.shadowBlur = 12;
        roundRect(x, y, size, size, 6);
        ctx.fill();
        ctx.shadowBlur = 0;

        // \u773c\u775b
        const eye = CELL * 0.12;
        const cx = s.x * CELL + CELL / 2;
        const cy = s.y * CELL + CELL / 2;
        // \u773c\u775b\u671d\u5411\u524d\u8fdb\u65b9\u5411\uff0c\u5206\u5217\u4e24\u4fa7
        const fx = dir.x * CELL * 0.15;   // \u524d\u79fb
        const fy = dir.y * CELL * 0.15;
        const sx = dir.y * CELL * 0.19;   // \u4fa7\u79fb
        const sy = -dir.x * CELL * 0.19;
        ctx.fillStyle = "#04170c";
        ctx.beginPath();
        ctx.arc(cx + fx + sx, cy + fy + sy, eye, 0, Math.PI * 2);
        ctx.arc(cx + fx - sx, cy + fy - sy, eye, 0, Math.PI * 2);
        ctx.fill();
      } else {
        // \u4ece\u4eae\u7eff\u6e10\u53d8\u5230\u9752\u8272
        const g = Math.round(200 - 60 * t);
        const b = Math.round(110 + 100 * t);
        ctx.fillStyle = `rgb(${Math.round(74 - 20 * t)}, ${g}, ${b})`;
        roundRect(x, y, size, size, 4);
        ctx.fill();
      }
    }
  }

  // ====== \u903b\u8f91 ======
  function step() {
    // \u5e94\u7528\u7f13\u51b2\u65b9\u5411\uff1a\u4e0d\u5141\u8bb8\u76f4\u63a5 180\u00b0 \u6389\u5934
    if (snake.length < 2 || !(nextDir.x === -dir.x && nextDir.y === -dir.y)) {
      dir = { x: nextDir.x, y: nextDir.y };
    }

    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // \u649e\u5899
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      return gameOver();
    }
    // \u649e\u81ea\u5df1\uff08\u5c3e\u5df4\u5c06\u8981\u79fb\u52a8\uff0c\u6240\u4ee5\u6700\u540e\u4e00\u683c\u4e0d\u7b97\uff09
    const willEat = food && head.x === food.x && head.y === food.y;
    const limit = willEat ? snake.length : snake.length - 1;
    for (let i = 0; i < limit; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) {
        return gameOver();
      }
    }

    snake.unshift(head);

    if (willEat) {
      score += 1;
      scoreEl.textContent = score;
      if (score % SPEEDUP_EVERY === 0) {
        tick = Math.max(MIN_TICK, tick - SPEEDUP_STEP);
        speedEl.textContent = Math.min(9, Math.floor((BASE_TICK - tick) / 40) + 1);
        // \u7b80\u5355\u5c4f\u5e55\u9707\u52a8\u53cd\u9988
        if (typeof canvas.animate === "function") {
          canvas.animate(
            [{ transform: "translate(0,0)" }, { transform: "translate(2px,-1px)" },
             { transform: "translate(-2px,1px)" }, { transform: "translate(0,0)" }],
            { duration: 120, easing: "ease-out" }
          );
        }
      }
      placeFood();
    } else {
      snake.pop();
    }
  }

  function lifeLost(title) {
    alive = false;
    running = false;
    if (score > best) {
      best = score;
      localStorage.setItem(bestKey, String(best));
      bestEl.textContent = best;
    }
    ovTitle.textContent = title;
    overlay.classList.add("over");
    startBtn.textContent = "\u518d\u6765\u4e00\u5c40";
    overlay.classList.remove("hidden");
  }

  function gameOver() {
    lifeLost("\u6e38\u620f\u7ed3\u675f");
    ovText.innerHTML = `\u672c\u6b21\u5f97\u5206 <b class="big">${score}</b><br>\u6700\u9ad8\u5206 ${best}`;
  }

  function win() {
    lifeLost("\u901a\u5173\u5566\uff01");
    ovText.innerHTML = `\u586b\u6ee1\u6574\u4e2a\u68cb\u76d8\uff0c\u5f97\u5206 <b class="big">${score}</b>`;
  }

  // ====== \u4e3b\u5faa\u73af ======
  function loop(now) {
    if (!running) return;
    if (!lastTime) lastTime = now;
    let delta = now - lastTime;
    lastTime = now;
    if (delta > 250) delta = 250; // \u5207\u6807\u7b7e\u9875\u56de\u6765\u4e0d\u8981\u77ac\u79fb

    foodPulse += delta / 160;

    if (!paused) {
      accumulator += delta;
      while (accumulator >= tick) {
        accumulator -= tick;
        step();
        if (!running) break;
      }
    }

    draw();
    requestAnimationFrame(loop);
  }

  // ====== \u63a7\u5236 ======
  function start() {
    if (!snake) reset();
    running = true;
    paused = false;
    alive = true;
    lastTime = 0;
    accumulator = 0;
    pausedTag.classList.remove("show");
    overlay.classList.add("hidden");
    canvas.focus && canvas.focus();
    requestAnimationFrame(loop);
  }

  // \u5f00\u59cb\u7b49\u5f85\uff1a\u86c7\u5df2\u6446\u597d\u4f46\u9759\u6b62\u4e0d\u52a8\uff0c\u6309\u65b9\u5411\u952e\u624d\u771f\u6b63\u8fc8\u51fa\u7b2c\u4e00\u6b65
  function waitForInput() {
    if (!snake) reset();
    running = false;
    paused = false;
    alive = true;
    lastTime = 0;
    accumulator = 0;
    pausedTag.classList.remove("show");
    startBtn.textContent = "\u5f00\u59cb\u6e38\u620f";
    ovTitle.textContent = "\u51c6\u5907\u5f00\u59cb";
    ovText.innerHTML = '\u6309 <kbd>\u2191</kbd><kbd>\u2193</kbd><kbd>\u2190</kbd><kbd>\u2192</kbd> \u4efb\u610f\u65b9\u5411\u952e\u51fa\u53d1<br>\u7a7a\u683c\u6682\u505c / R \u91cd\u5f00';
    overlay.classList.remove("over");
    overlay.classList.remove("hidden");
    draw();
  }

  function restart() {
    reset();
    start();
  }

  function togglePause() {
    if (!running) return;
    paused = !paused;
    if (!paused) lastTime = 0;
    pausedTag.classList.toggle("show", paused);
  }

  function setDir(x, y) {
    // \u4e0d\u80fd 180 \u5ea6\u6389\u5934
    if (x === -dir.x && y === -dir.y) return;
    nextDir = { x, y };
  }

  const KEYMAP = {
    ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
    w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0],
    W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0],
    k: [0, -1], j: [0, 1], h: [-1, 0], l: [1, 0]
  };

  window.addEventListener("keydown", (e) => {
    if (e.key === " " || e.key === "Spacebar") {
      e.preventDefault();
      if (!running) start();
      else togglePause();
      return;
    }
    if (e.key === "Enter") {
      e.preventDefault();
      if (!running) start();
      return;
    }
    if (e.key === "r" || e.key === "R") {
      restart();
      return;
    }
    const m = KEYMAP[e.key];
    if (m) {
      e.preventDefault();
      // \u7b49\u5f85\u5f00\u59cb\u65f6\uff1a\u6309\u65b9\u5411\u952e\u76f4\u63a5\u8d77\u6b65\uff0c\u5e76\u671d\u8be5\u65b9\u5411\u8fc8\u51fa\u7b2c\u4e00\u6b65
      if (!running) {
        if (snake) reset();
        if (!(m[0] === -dir.x && m[1] === -dir.y)) {
          dir = { x: m[0], y: m[1] };
          nextDir = { x: m[0], y: m[1] };
        }
        start();
        return;
      }
      setDir(m[0], m[1]);
    }
  });

  startBtn.addEventListener("click", () => {
    if (overlay.classList.contains("over")) restart();
    else start();
  });

  // \u89e6\u6478\u6ed1\u52a8
  let touchStart = null;
  canvas.addEventListener("touchstart", (e) => {
    const t = e.changedTouches[0];
    touchStart = { x: t.clientX, y: t.clientY };
    e.preventDefault();
  }, { passive: false });

  canvas.addEventListener("touchend", (e) => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
    else setDir(0, dy > 0 ? 1 : -1);
    e.preventDefault();
  }, { passive: false });

  window.addEventListener("resize", fitCanvas);

  // \u5207\u5230\u540e\u53f0\u81ea\u52a8\u6682\u505c
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && running && !paused) togglePause();
  });

  // ====== \u542f\u52a8 ======
  waitForInput();
  fitCanvas();
  draw();
})();
</script>
</body>
</html>
